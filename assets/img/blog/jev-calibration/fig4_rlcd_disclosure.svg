<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What is and is not publicly known about Jev's RLCD</title>
  <desc id="desc">Three cards separate publicly documented facts, vendor claims, and undisclosed training details. A lower panel presents OpenJev-RLCD as an independent two-stage research proposal and explicitly states that it is not the official Jev recipe.</desc>
  <defs>
    <pattern id="unknown-pattern" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#f7eeee"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#d9b9b5" stroke-width="5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#28343a"/>
    </marker>
    <style>
      .title{font:700 48px Arial,Helvetica,sans-serif;fill:#20282e}
      .subtitle{font:400 27px Arial,Helvetica,sans-serif;fill:#556169}
      .eyebrow{font:700 24px Arial,Helvetica,sans-serif;letter-spacing:1.1px}
      .head{font:700 29px Arial,Helvetica,sans-serif;fill:#20282e}
      .body{font:400 24px Arial,Helvetica,sans-serif;fill:#354149}
      .note{font:700 24px Arial,Helvetica,sans-serif;fill:#556169}
      .edge{fill:none;stroke:#28343a;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="70" y="72" class="title">RLCD disclosure: evidence boundaries matter</text>
  <text x="70" y="114" class="subtitle">The product interface is public. The proprietary training recipe is not.</text>

  <g transform="translate(55 166)">
    <rect width="470" height="340" rx="25" fill="#e8f1ee" stroke="#176d62" stroke-width="3"/>
    <text x="28" y="46" class="eyebrow" fill="#176d62">PUBLICLY DOCUMENTED</text>
    <text x="28" y="91" class="head">Known</text>
    <line x1="28" y1="110" x2="442" y2="110" stroke="#176d62" stroke-width="2"/>
    <text x="30" y="151" class="body">
      <tspan x="30">• Noul, Choice, Score primitives</tspan>
      <tspan x="30" dy="39">• Typed probability distributions</tspan>
      <tspan x="30" dy="39">• Questions evaluated independently</tspan>
      <tspan x="30" dy="39">• Derived concentration confidence</tspan>
      <tspan x="30" dy="39">• Fast structured-decision API</tspan>
    </text>
  </g>

  <g transform="translate(565 166)">
    <rect width="470" height="340" rx="25" fill="#f6efd8" stroke="#8b7125" stroke-width="3" stroke-dasharray="11 7"/>
    <text x="28" y="46" class="eyebrow" fill="#8b7125">VENDOR-PRESENTED</text>
    <text x="28" y="91" class="head">Claimed stack</text>
    <line x1="28" y1="110" x2="442" y2="110" stroke="#8b7125" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="30" y="151" class="body">
      <tspan x="30">• New model architecture</tspan>
      <tspan x="30" dy="39">• Parallel sampler</tspan>
      <tspan x="30" dy="39">• “RL for Calibrated Decisions”</tspan>
      <tspan x="30" dy="39">• Calibrated decision probabilities</tspan>
      <tspan x="30" dy="39">• Large speed and cost advantage</tspan>
    </text>
  </g>

  <g transform="translate(1075 166)">
    <rect width="470" height="340" rx="25" fill="url(#unknown-pattern)" stroke="#8b4a3c" stroke-width="3"/>
    <text x="28" y="46" class="eyebrow" fill="#8b4a3c">NOT DISCLOSED</text>
    <text x="28" y="91" class="head">Unknown</text>
    <line x1="28" y1="110" x2="442" y2="110" stroke="#8b4a3c" stroke-width="2"/>
    <text x="30" y="151" class="body">
      <tspan x="30">• Exact reward and objective</tspan>
      <tspan x="30" dy="39">• Base model, size, and architecture</tspan>
      <tspan x="30" dy="39">• Data mixture and outcome labels</tspan>
      <tspan x="30" dy="39">• Optimizer and training schedule</tspan>
      <tspan x="30" dy="39">• Calibration and robustness protocol</tspan>
    </text>
  </g>

  <g transform="translate(95 574)">
    <rect width="1410" height="238" rx="26" fill="#fff" stroke="#315f87" stroke-width="3"/>
    <rect width="1410" height="54" rx="26" fill="#dfe8f1"/>
    <rect y="28" width="1410" height="26" fill="#dfe8f1"/>
    <text x="705" y="37" text-anchor="middle" class="eyebrow" fill="#244f72">INDEPENDENT RESEARCH PROPOSAL — NOT TYPESAFE'S OFFICIAL RECIPE</text>

    <g transform="translate(36 84)">
      <rect width="545" height="120" rx="20" fill="#edf3f8" stroke="#315f87" stroke-width="2.5"/>
      <text x="24" y="42" class="head">Stage 1 · Calibrate the readout</text>
      <text x="24" y="81" class="body">Proper score on each on-policy rationale;</text>
      <text x="24" y="111" class="body">pathwise gradient only.</text>
    </g>
    <path d="M590 144H760" class="edge"/>
    <g transform="translate(785 84)">
      <rect width="585" height="120" rx="20" fill="#edf3f8" stroke="#315f87" stroke-width="2.5"/>
      <text x="24" y="42" class="head">Stage 2 · Reinforce the reasoning</text>
      <text x="24" y="81" class="body">Same proper score as reward; leave-one-out</text>
      <text x="24" y="111" class="body">baseline plus KL anchor to Stage 1.</text>
    </g>
  </g>

  <text x="800" y="860" text-anchor="middle" class="note">OpenJev-RLCD is a valuable hypothesis about how calibrated-decision RL can work—not evidence about Jev internals.</text>
</svg>
