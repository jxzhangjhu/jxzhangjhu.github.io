<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">An open ecosystem forming around Jev</title>
  <desc id="desc">A four-layer ecosystem map flows from datasets and benchmarks, through training and readout methods, to models and serving, and finally to applications and cascades. A reproduction checklist distinguishes open artifacts from claims of equivalence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#28343a"/>
    </marker>
    <style>
      .title{font:700 44px Arial,Helvetica,sans-serif;fill:#20282e}
      .subtitle{font:400 25px Arial,Helvetica,sans-serif;fill:#556169}
      .layer{font:700 15px Arial,Helvetica,sans-serif;letter-spacing:1.2px}
      .layer-head{font:700 25px Arial,Helvetica,sans-serif;fill:#20282e}
      .layer-note{font:400 17px Arial,Helvetica,sans-serif;fill:#4e5960}
      .card-head{font:700 20px Arial,Helvetica,sans-serif;fill:#20282e}
      .card-body{font:400 17px Arial,Helvetica,sans-serif;fill:#354149}
      .num{font:700 22px Arial,Helvetica,sans-serif;fill:#fff}
      .flow{font:700 14px Arial,Helvetica,sans-serif;letter-spacing:.6px;fill:#556169}
      .check-head{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#20282e}
      .check{font:700 17px Arial,Helvetica,sans-serif;fill:#354149}
      .foot{font:700 19px Arial,Helvetica,sans-serif;fill:#556169}
      .edge{fill:none;stroke:#28343a;stroke-width:3.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf6"/>
  <text x="48" y="62" class="title">An open ecosystem is forming around Jev</text>
  <text x="48" y="101" class="subtitle">Benchmarks define evidence; methods shape readouts; models expose contracts; systems decide where to act.</text>

  <!-- Layer 1: datasets and benchmarks -->
  <g transform="translate(55 136)">
    <rect width="1290" height="158" rx="24" fill="#e8f1ee" stroke="#176d62" stroke-width="3"/>
    <rect width="225" height="158" rx="24" fill="#d4e7e1"/>
    <path d="M201 0H225V158H201Z" fill="#d4e7e1"/>
    <circle cx="34" cy="34" r="22" fill="#176d62"/>
    <text x="34" y="42" text-anchor="middle" class="num">1</text>
    <text x="66" y="28" class="layer" fill="#176d62">LAYER ONE</text>
    <text x="24" y="73" class="layer-head">Datasets &amp;</text>
    <text x="24" y="101" class="layer-head">benchmarks</text>
    <text x="24" y="130" class="layer-note">What counts as evidence?</text>

    <g transform="translate(246 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Core schemas</text>
      <text x="18" y="61" class="card-body">typed-decisions</text>
      <text x="18" y="87" class="card-body">JevBench tasks</text>
    </g>
    <g transform="translate(504 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Evaluation harness</text>
      <text x="18" y="61" class="card-body">Jevals</text>
      <text x="18" y="87" class="card-body">raw outputs + metrics</text>
    </g>
    <g transform="translate(762 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Stress suites</text>
      <text x="18" y="61" class="card-body">JevAdvBench</text>
      <text x="18" y="87" class="card-body">Sys1Cal</text>
    </g>
    <g transform="translate(1020 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Domain suites</text>
      <text x="18" y="61" class="card-body">CSS · security</text>
      <text x="18" y="87" class="card-body">CJ-Bench</text>
    </g>
  </g>

  <path d="M700 295V315" class="edge"/>
  <text x="718" y="310" class="flow">DEFINES SIGNALS</text>

  <!-- Layer 2: training and readout methods -->
  <g transform="translate(55 320)">
    <rect width="1290" height="158" rx="24" fill="#f6efd8" stroke="#8b7125" stroke-width="3"/>
    <rect width="225" height="158" rx="24" fill="#efe3bd"/>
    <path d="M201 0H225V158H201Z" fill="#efe3bd"/>
    <circle cx="34" cy="34" r="22" fill="#8b7125"/>
    <text x="34" y="42" text-anchor="middle" class="num">2</text>
    <text x="66" y="28" class="layer" fill="#8b7125">LAYER TWO</text>
    <text x="24" y="73" class="layer-head">Training &amp;</text>
    <text x="24" y="101" class="layer-head">readout methods</text>
    <text x="24" y="130" class="layer-note">How is confidence made?</text>

    <g transform="translate(246 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Proper-score RL</text>
      <text x="18" y="61" class="card-body">OpenJev-RLCD</text>
      <text x="18" y="87" class="card-body">calibrated readout + RL</text>
    </g>
    <g transform="translate(504 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Likelihood readout</text>
      <text x="18" y="61" class="card-body">LLM2Jev</text>
      <text x="18" y="87" class="card-body">option-token probability</text>
    </g>
    <g transform="translate(762 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Post-hoc scaling</text>
      <text x="18" y="61" class="card-body">temperature</text>
      <text x="18" y="87" class="card-body">task-specific thresholds</text>
    </g>
    <g transform="translate(1020 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Bias correction</text>
      <text x="18" y="61" class="card-body">BA-LoRA</text>
      <text x="18" y="87" class="card-body">prior + order correction</text>
    </g>
  </g>

  <path d="M700 479V499" class="edge"/>
  <text x="718" y="494" class="flow">BECOMES A CONTRACT</text>

  <!-- Layer 3: models and serving -->
  <g transform="translate(55 504)">
    <rect width="1290" height="158" rx="24" fill="#eef0f5" stroke="#4a5f86" stroke-width="3"/>
    <rect width="225" height="158" rx="24" fill="#dfe8f1"/>
    <path d="M201 0H225V158H201Z" fill="#dfe8f1"/>
    <circle cx="34" cy="34" r="22" fill="#4a5f86"/>
    <text x="34" y="42" text-anchor="middle" class="num">3</text>
    <text x="66" y="28" class="layer" fill="#4a5f86">LAYER THREE</text>
    <text x="24" y="73" class="layer-head">Models &amp;</text>
    <text x="24" y="101" class="layer-head">serving</text>
    <text x="24" y="130" class="layer-note">What can be pinned?</text>

    <g transform="translate(246 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#8b7125" stroke-width="2.2" stroke-dasharray="8 6"/>
      <text x="18" y="31" class="card-head">Closed reference</text>
      <text x="18" y="61" class="card-body">Jev 1.13 API</text>
      <text x="18" y="87" class="card-body">public I/O, private weights</text>
    </g>
    <g transform="translate(504 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Open models</text>
      <text x="18" y="61" class="card-body">Laya · Kev</text>
      <text x="18" y="87" class="card-body">Decider</text>
    </g>
    <g transform="translate(762 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Emerging models</text>
      <text x="18" y="61" class="card-body">Nimble</text>
      <text x="18" y="87" class="card-body">Chinese-Jev</text>
    </g>
    <g transform="translate(1020 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Serving layer</text>
      <text x="18" y="61" class="card-body">adapters · local inference</text>
      <text x="18" y="87" class="card-body">versioned logs</text>
    </g>
  </g>

  <path d="M700 663V683" class="edge"/>
  <text x="718" y="678" class="flow">DRIVES POLICY</text>

  <!-- Layer 4: applications and cascades -->
  <g transform="translate(55 688)">
    <rect width="1290" height="158" rx="24" fill="#f3e7e5" stroke="#8b4a3c" stroke-width="3"/>
    <rect width="225" height="158" rx="24" fill="#ead8d5"/>
    <path d="M201 0H225V158H201Z" fill="#ead8d5"/>
    <circle cx="34" cy="34" r="22" fill="#8b4a3c"/>
    <text x="34" y="42" text-anchor="middle" class="num">4</text>
    <text x="66" y="28" class="layer" fill="#8b4a3c">LAYER FOUR</text>
    <text x="24" y="73" class="layer-head">Applications &amp;</text>
    <text x="24" y="101" class="layer-head">cascades</text>
    <text x="24" y="130" class="layer-note">Where does a score act?</text>

    <g transform="translate(246 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Decision operations</text>
      <text x="18" y="61" class="card-body">routing · annotation</text>
      <text x="18" y="87" class="card-body">triage</text>
    </g>
    <g transform="translate(504 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Agents</text>
      <text x="18" y="61" class="card-body">memory · tools</text>
      <text x="18" y="87" class="card-body">stop / continue</text>
    </g>
    <g transform="translate(762 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Risk screens</text>
      <text x="18" y="61" class="card-body">security · safety</text>
      <text x="18" y="87" class="card-body">drift monitoring</text>
    </g>
    <g transform="translate(1020 20)">
      <rect width="240" height="118" rx="17" fill="#fff" stroke="#4f5b62" stroke-width="2"/>
      <text x="18" y="31" class="card-head">Cascades</text>
      <text x="18" y="61" class="card-body">Jev → LLM → human</text>
      <text x="18" y="87" class="card-body">cost × risk gates</text>
    </g>
  </g>

  <g transform="translate(55 878)">
    <rect width="1290" height="72" rx="20" fill="#fff" stroke="#59656c" stroke-width="2.5"/>
    <text x="24" y="29" class="check-head">REPRODUCTION CHECK</text>
    <text x="24" y="54" class="layer-note">Open means inspectable artifacts:</text>
    <g transform="translate(300 17)">
      <rect width="140" height="38" rx="12" fill="#e8f1ee" stroke="#176d62" stroke-width="2"/>
      <text x="70" y="25" text-anchor="middle" class="check">code</text>
    </g>
    <g transform="translate(454 17)">
      <rect width="140" height="38" rx="12" fill="#eef0f5" stroke="#4a5f86" stroke-width="2"/>
      <text x="70" y="25" text-anchor="middle" class="check">weights</text>
    </g>
    <g transform="translate(608 17)">
      <rect width="140" height="38" rx="12" fill="#f6efd8" stroke="#8b7125" stroke-width="2"/>
      <text x="70" y="25" text-anchor="middle" class="check">data</text>
    </g>
    <g transform="translate(762 17)">
      <rect width="184" height="38" rx="12" fill="#f2edf5" stroke="#71517c" stroke-width="2"/>
      <text x="92" y="25" text-anchor="middle" class="check">raw outputs</text>
    </g>
    <g transform="translate(960 17)">
      <rect width="270" height="38" rx="12" fill="#f3e7e5" stroke="#8b4a3c" stroke-width="2"/>
      <text x="135" y="25" text-anchor="middle" class="check">pinned versions + licenses</text>
    </g>
  </g>
  <text x="700" y="982" text-anchor="middle" class="foot">Open is a set of inspectable artifacts—not a claim that every method or model is equivalent.</text>
</svg>
