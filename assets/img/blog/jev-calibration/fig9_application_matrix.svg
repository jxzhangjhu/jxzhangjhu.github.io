<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Application matrix for Jev, language models, validators, and humans</title>
  <desc id="desc">A two-dimensional matrix places use cases by latency sensitivity and cost of error. Routing, retrieval scoring, and tool selection sit in the fast typed-decision region; high-cost cases call for validators, language models, or humans.</desc>
  <defs>
    <style>
      .title{font:700 48px Arial,Helvetica,sans-serif;fill:#20282e}
      .subtitle{font:400 27px Arial,Helvetica,sans-serif;fill:#556169}
      .axis{font:700 26px Arial,Helvetica,sans-serif;fill:#354149}
      .quad{font:700 25px Arial,Helvetica,sans-serif;letter-spacing:.7px}
      .point{font:700 25px Arial,Helvetica,sans-serif;fill:#20282e}
      .body{font:400 24px Arial,Helvetica,sans-serif;fill:#4e5960}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="70" y="72" class="title">Choose the decision path from risk and latency</text>
  <text x="70" y="114" class="subtitle">The fastest model should not automatically own the highest-stakes action.</text>

  <g transform="translate(190 172)">
    <rect width="1160" height="580" rx="24" fill="#fff" stroke="#4f5b62" stroke-width="3"/>
    <path d="M0 0H580V290H0Z" fill="#f2edf5"/>
    <path d="M580 0H1160V290H580Z" fill="#f3e7e5"/>
    <path d="M0 290H580V580H0Z" fill="#f4f1ea"/>
    <path d="M580 290H1160V580H580Z" fill="#e7f1ee"/>
    <line x1="580" y1="0" x2="580" y2="580" stroke="#667178" stroke-width="3" stroke-dasharray="12 9"/>
    <line x1="0" y1="290" x2="1160" y2="290" stroke="#667178" stroke-width="3" stroke-dasharray="12 9"/>

    <text x="24" y="38" class="quad" fill="#71517c">DELIBERATE + REQUIRE REVIEW</text>
    <text x="604" y="38" class="quad" fill="#8b4a3c">FAST GATE + VERIFIED FALLBACK</text>
    <text x="24" y="330" class="quad" fill="#6f675d">BATCH / ENRICH / OBSERVE</text>
    <text x="604" y="330" class="quad" fill="#176d62">Jev sweet spot</text>

    <g transform="translate(205 105)">
      <path d="M0-17L17 17H-17Z" fill="#71517c" stroke="#20282e" stroke-width="2"/>
      <text x="29" y="9" class="point">Human approval</text>
      <text x="29" y="43" class="body">irreversible decisions</text>
    </g>
    <g transform="translate(330 210)">
      <path d="M0-17L17 17H-17Z" fill="#566f9d" stroke="#20282e" stroke-width="2"/>
      <text x="29" y="9" class="point">LLM deliberation</text>
      <text x="29" y="43" class="body">novel or ambiguous cases</text>
    </g>
    <g transform="translate(695 115)">
      <rect x="-17" y="-17" width="34" height="34" rx="4" fill="#fff" stroke="#8b4a3c" stroke-width="5"/>
      <text x="29" y="9" class="point">Independent validator</text>
      <text x="29" y="43" class="body">before consequential action</text>
    </g>
    <g transform="translate(830 225)">
      <rect x="-17" y="-17" width="34" height="34" rx="4" fill="#fff" stroke="#8b4a3c" stroke-width="5"/>
      <text x="29" y="9" class="point">Guardrail gate</text>
      <text x="29" y="43" class="body">Jev first, verify on uncertainty</text>
    </g>

    <g transform="translate(230 445)">
      <circle r="18" fill="#81786d" stroke="#20282e" stroke-width="2"/>
      <text x="31" y="9" class="point">Offline enrichment</text>
      <text x="31" y="43" class="body">cost matters more than milliseconds</text>
    </g>
    <g transform="translate(690 410)">
      <circle r="18" fill="#176d62" stroke="#20282e" stroke-width="2"/>
      <text x="31" y="9" class="point">Retrieval scoring</text>
    </g>
    <g transform="translate(850 500)">
      <circle r="18" fill="#176d62" stroke="#20282e" stroke-width="2"/>
      <text x="31" y="9" class="point">Tool selection</text>
    </g>
    <g transform="translate(965 395)">
      <circle r="18" fill="#176d62" stroke="#20282e" stroke-width="2"/>
      <text x="31" y="9" class="point">Routing</text>
    </g>
    <g transform="translate(980 525)">
      <circle r="18" fill="#176d62" stroke="#20282e" stroke-width="2"/>
      <text x="31" y="9" class="point">Triage</text>
    </g>

    <ellipse cx="885" cy="453" rx="245" ry="105" fill="none" stroke="#176d62" stroke-width="4" stroke-dasharray="14 9"/>
  </g>

  <text x="770" y="806" text-anchor="middle" class="axis">LOW ← LATENCY SENSITIVITY → HIGH</text>
  <text x="124" y="462" text-anchor="middle" class="axis" transform="rotate(-90 124 462)">LOW ← COST OF ERROR → HIGH</text>

  <g transform="translate(290 842)">
    <circle cx="0" cy="0" r="14" fill="#176d62" stroke="#20282e" stroke-width="2"/>
    <text x="26" y="8" class="body">direct typed decision</text>
    <rect x="330" y="-14" width="28" height="28" rx="3" fill="#fff" stroke="#8b4a3c" stroke-width="4"/>
    <text x="376" y="8" class="body">verified cascade</text>
    <path d="M700-14L714 14H686Z" fill="#71517c" stroke="#20282e" stroke-width="2"/>
    <text x="730" y="8" class="body">LLM / human deliberation</text>
  </g>
</svg>
