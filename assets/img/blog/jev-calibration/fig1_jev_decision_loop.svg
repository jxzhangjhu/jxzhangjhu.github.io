<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Jev turns state and typed questions into risk-aware actions</title>
  <desc id="desc">A decision loop in which application state and typed questions enter Jev, Jev returns probability distributions, and application policy chooses to act, verify, or escalate before outcomes feed back into evaluation and recalibration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#263238"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#8b4a3c"/>
    </marker>
    <style>
      .title{font:700 48px Arial,Helvetica,sans-serif;fill:#20282e}
      .subtitle{font:400 27px Arial,Helvetica,sans-serif;fill:#556169}
      .eyebrow{font:700 24px Arial,Helvetica,sans-serif;letter-spacing:1.2px}
      .head{font:700 31px Arial,Helvetica,sans-serif;fill:#20282e}
      .body{font:400 25px Arial,Helvetica,sans-serif;fill:#354149}
      .note{font:600 24px Arial,Helvetica,sans-serif;fill:#556169}
      .edge{fill:none;stroke:#263238;stroke-width:4;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#8b4a3c;stroke-width:4;stroke-dasharray:12 9;marker-end:url(#arrow-feedback)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="70" y="74" class="title">From model output to an operational decision</text>
  <text x="70" y="116" class="subtitle">Jev is useful when probability becomes a control signal—not merely another line of text.</text>

  <g transform="translate(70 196)">
    <rect width="300" height="330" rx="26" fill="#f4efe5" stroke="#4f5b62" stroke-width="3"/>
    <text x="28" y="48" class="eyebrow" fill="#596168">INPUT CONTRACT</text>
    <text x="28" y="98" class="head">State</text>
    <text x="28" y="136" class="body">
      <tspan x="28">User, event, document,</tspan>
      <tspan x="28" dy="34">or program state</tspan>
    </text>
    <line x1="28" y1="206" x2="272" y2="206" stroke="#a8a196" stroke-width="2"/>
    <text x="28" y="250" class="head">Typed questions</text>
    <text x="28" y="290" class="body">Noul · Choice · Score</text>
  </g>

  <path d="M370 360H450" class="edge"/>

  <g transform="translate(470 236)">
    <rect width="260" height="250" rx="42" fill="#dcece7" stroke="#176d62" stroke-width="5"/>
    <circle cx="130" cy="76" r="34" fill="#176d62"/>
    <path d="M113 76h34M130 59v34" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="130" y="144" text-anchor="middle" class="head">Jev</text>
    <text x="130" y="184" text-anchor="middle" class="body">System One model</text>
    <text x="130" y="220" text-anchor="middle" class="note">parallel evaluation</text>
  </g>

  <path d="M730 360H810" class="edge"/>

  <g transform="translate(830 196)">
    <rect width="310" height="330" rx="26" fill="#e8eef7" stroke="#315f87" stroke-width="3"/>
    <text x="28" y="48" class="eyebrow" fill="#315f87">OUTPUT CONTRACT</text>
    <text x="28" y="98" class="head">Probabilities</text>
    <g transform="translate(30 132)">
      <rect width="250" height="34" rx="8" fill="#d1d7dd"/>
      <rect width="170" height="34" rx="8" fill="#315f87"/>
      <text x="12" y="27" class="note" style="fill:#fff">Option A · 0.68</text>
      <rect y="54" width="250" height="34" rx="8" fill="#d1d7dd"/>
      <rect y="54" width="58" height="34" rx="8" fill="#708fa9"/>
      <text x="72" y="81" class="note">B · 0.23</text>
      <rect y="108" width="250" height="34" rx="8" fill="#d1d7dd"/>
      <rect y="108" width="23" height="34" rx="8" fill="#9eb1c1"/>
      <text x="38" y="135" class="note">C · 0.09</text>
    </g>
    <text x="155" y="292" text-anchor="middle" class="note">Structured · inspectable</text>
    <text x="155" y="321" text-anchor="middle" class="note">sortable · branchable</text>
  </g>

  <path d="M1140 360H1220" class="edge"/>

  <g transform="translate(1240 176)">
    <rect width="290" height="370" rx="26" fill="#f6eadf" stroke="#8b4a3c" stroke-width="3"/>
    <text x="26" y="48" class="eyebrow" fill="#8b4a3c">ACTION POLICY</text>
    <text x="26" y="94" class="head">Risk × probability</text>

    <g transform="translate(26 126)">
      <rect width="238" height="62" rx="14" fill="#e5eee8" stroke="#47755c" stroke-width="2.5"/>
      <circle cx="31" cy="31" r="12" fill="#47755c"/>
      <text x="56" y="40" class="body" font-weight="700">ACT</text>
    </g>
    <g transform="translate(26 205)">
      <rect width="238" height="62" rx="14" fill="#f5edcf" stroke="#8b7125" stroke-width="2.5" stroke-dasharray="9 6"/>
      <circle cx="31" cy="31" r="12" fill="#8b7125"/>
      <text x="56" y="40" class="body" font-weight="700">VERIFY</text>
    </g>
    <g transform="translate(26 284)">
      <rect width="238" height="62" rx="14" fill="#f0dfe1" stroke="#8b4a3c" stroke-width="2.5"/>
      <circle cx="31" cy="31" r="12" fill="#8b4a3c"/>
      <text x="56" y="40" class="body" font-weight="700">ESCALATE</text>
    </g>
  </g>

  <g transform="translate(270 640)">
    <rect width="1060" height="100" rx="24" fill="#fff" stroke="#6a7379" stroke-width="2.5"/>
    <text x="530" y="42" text-anchor="middle" class="head">Observed outcomes</text>
    <text x="530" y="77" text-anchor="middle" class="body">correctness · cost · latency · abstention · downstream harm</text>
  </g>

  <path d="M1385 546V590Q1385 640 1330 690" class="feedback"/>
  <path d="M270 690H176Q120 690 120 630V548" class="feedback"/>
  <rect x="485" y="776" width="630" height="54" rx="27" fill="#fbfaf6" stroke="#8b4a3c" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="800" y="812" text-anchor="middle" class="note">Evaluate → set thresholds → monitor drift → recalibrate</text>
</svg>
