<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The calibration stack from probability to action</title>
  <desc id="desc">Four stages distinguish a model probability distribution, a derived concentration confidence, population calibration, and application-specific risk thresholds. Small reliability and risk-coverage plots show why each layer answers a different question.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#28343a"/>
    </marker>
    <style>
      .title{font:700 48px Arial,Helvetica,sans-serif;fill:#20282e}
      .subtitle{font:400 27px Arial,Helvetica,sans-serif;fill:#556169}
      .num{font:700 25px Arial,Helvetica,sans-serif;fill:#fff}
      .head{font:700 29px Arial,Helvetica,sans-serif;fill:#20282e}
      .body{font:400 24px Arial,Helvetica,sans-serif;fill:#354149}
      .label{font:700 24px Arial,Helvetica,sans-serif;fill:#4e5960}
      .edge{fill:none;stroke:#28343a;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="70" y="72" class="title">Calibration is a stack—not a single score</text>
  <text x="70" y="114" class="subtitle">Do not confuse a sharp distribution with empirical reliability or a safe deployment threshold.</text>

  <g transform="translate(60 174)">
    <rect width="340" height="286" rx="24" fill="#e8eef7" stroke="#315f87" stroke-width="3"/>
    <circle cx="42" cy="42" r="24" fill="#315f87"/>
    <text x="42" y="51" text-anchor="middle" class="num">1</text>
    <text x="78" y="51" class="head">Probability</text>
    <text x="26" y="98" class="body">Full outcome distribution</text>
    <g transform="translate(26 126)">
      <rect width="288" height="30" rx="7" fill="#cfd8df"/>
      <rect width="196" height="30" rx="7" fill="#315f87"/>
      <text x="14" y="24" class="label" fill="#fff">A · 0.68</text>
      <rect y="42" width="288" height="30" rx="7" fill="#cfd8df"/>
      <rect y="42" width="66" height="30" rx="7" fill="#7893aa"/>
      <text x="80" y="66" class="label">B · 0.23</text>
      <rect y="84" width="288" height="30" rx="7" fill="#cfd8df"/>
      <rect y="84" width="26" height="30" rx="7" fill="#a1b1be"/>
      <text x="42" y="108" class="label">C · 0.09</text>
    </g>
    <text x="170" y="270" text-anchor="middle" class="label">What belief is reported?</text>
  </g>

  <path d="M400 317H430" class="edge"/>

  <g transform="translate(450 174)">
    <rect width="340" height="286" rx="24" fill="#e8f1ee" stroke="#176d62" stroke-width="3"/>
    <circle cx="42" cy="42" r="24" fill="#176d62"/>
    <text x="42" y="51" text-anchor="middle" class="num">2</text>
    <text x="78" y="51" class="head">Derived confidence</text>
    <text x="26" y="98" class="body">Concentration summary</text>
    <g transform="translate(170 174)">
      <circle r="72" fill="#fff" stroke="#176d62" stroke-width="12" stroke-dasharray="310 142" transform="rotate(-90)"/>
      <text y="10" text-anchor="middle" class="head">0.52</text>
    </g>
    <text x="170" y="270" text-anchor="middle" class="label">How sharp is it?</text>
  </g>

  <path d="M790 317H820" class="edge"/>

  <g transform="translate(840 174)">
    <rect width="340" height="286" rx="24" fill="#f5edcf" stroke="#8b7125" stroke-width="3" stroke-dasharray="10 7"/>
    <circle cx="42" cy="42" r="24" fill="#8b7125"/>
    <text x="42" y="51" text-anchor="middle" class="num">3</text>
    <text x="78" y="51" class="head">Population calibration</text>
    <text x="26" y="98" class="body">Across comparable cases:</text>
    <text x="170" y="174" text-anchor="middle" class="head">“0.8” → correct ≈ 80%</text>
    <line x1="50" y1="205" x2="290" y2="205" stroke="#8b7125" stroke-width="3"/>
    <text x="170" y="270" text-anchor="middle" class="label">Does p match frequency?</text>
  </g>

  <path d="M1180 317H1210" class="edge"/>

  <g transform="translate(1230 174)">
    <rect width="310" height="286" rx="24" fill="#f2e3e2" stroke="#8b4a3c" stroke-width="3"/>
    <circle cx="42" cy="42" r="24" fill="#8b4a3c"/>
    <text x="42" y="51" text-anchor="middle" class="num">4</text>
    <text x="78" y="51" class="head">Risk threshold</text>
    <text x="26" y="102" class="body">Application policy</text>
    <g transform="translate(26 118)">
      <rect width="258" height="34" rx="9" fill="#dfe9e2" stroke="#47755c" stroke-width="2"/>
      <text x="129" y="26" text-anchor="middle" class="label">ACT</text>
      <rect y="44" width="258" height="34" rx="9" fill="#f5edcf" stroke="#8b7125" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="129" y="70" text-anchor="middle" class="label">VERIFY</text>
      <rect y="88" width="258" height="34" rx="9" fill="#f0dfe1" stroke="#8b4a3c" stroke-width="2"/>
      <text x="129" y="114" text-anchor="middle" class="label">ESCALATE</text>
    </g>
    <text x="155" y="270" text-anchor="middle" class="label">What action follows?</text>
  </g>

  <g transform="translate(120 550)">
    <rect width="610" height="270" rx="24" fill="#fff" stroke="#69747b" stroke-width="2.5"/>
    <text x="28" y="44" class="head">Reliability diagram</text>
    <text x="28" y="79" class="body">Absolute probability quality</text>
    <line x1="92" y1="225" x2="540" y2="225" stroke="#354149" stroke-width="3"/>
    <line x1="92" y1="225" x2="92" y2="104" stroke="#354149" stroke-width="3"/>
    <line x1="92" y1="225" x2="520" y2="104" stroke="#9ba3a8" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M92 215C190 210 230 183 310 174S425 132 520 122" fill="none" stroke="#315f87" stroke-width="6"/>
    <text x="316" y="258" text-anchor="middle" class="label">predicted probability →</text>
    <text x="72" y="172" text-anchor="middle" class="label" transform="rotate(-90 72 172)">frequency →</text>
  </g>

  <g transform="translate(870 550)">
    <rect width="610" height="270" rx="24" fill="#fff" stroke="#69747b" stroke-width="2.5"/>
    <text x="28" y="44" class="head">Risk–coverage curve</text>
    <text x="28" y="79" class="body">Operational usefulness of confidence ranking</text>
    <line x1="92" y1="225" x2="540" y2="225" stroke="#354149" stroke-width="3"/>
    <line x1="92" y1="225" x2="92" y2="104" stroke="#354149" stroke-width="3"/>
    <path d="M92 218C180 210 245 194 325 168S450 125 520 108" fill="none" stroke="#8b4a3c" stroke-width="6"/>
    <line x1="92" y1="150" x2="540" y2="150" stroke="#8b7125" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="460" y="140" class="label">risk budget</text>
    <text x="316" y="258" text-anchor="middle" class="label">automated coverage →</text>
    <text x="72" y="172" text-anchor="middle" class="label" transform="rotate(-90 72 172)">error →</text>
  </g>
  <text x="800" y="866" text-anchor="middle" class="label">A well-calibrated model can still need task-specific thresholds; a sharp distribution can still be wrong.</text>
</svg>
