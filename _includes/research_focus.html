<section class="research-focus" aria-labelledby="research-focus-title">
  <h2 id="research-focus-title" class="homepage-section-title">Research Directions</h2>
  <nav class="research-focus-grid" aria-label="Research directions and related publications">
    {% for group in site.data.research_groups %}
      <a class="research-focus-card" href="#research-{{ group.key }}">
        <span class="research-card-number">0{{ forloop.index }}</span>
        <span class="research-card-title">{{ group.title }}</span>
        <span class="research-card-focus">{{ group.focus }}</span>
      </a>
    {% endfor %}
  </nav>
</section>
